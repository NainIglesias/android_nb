name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to attach the APK to a release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Chaquopy compiles the app's Python with a host Python of the same version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v6

      - name: Kernel tests (host Python)
        run: |
          python -m pip install --quiet matplotlib pandas
          python -m unittest discover -s python-tests -v

      - name: Signing key (optional)
        env:
          NB_KEYSTORE_BASE64: ${{ secrets.NB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NB_KEYSTORE_BASE64" ]; then
            echo "$NB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nb.jks"
            echo "NB_KEYSTORE_PATH=$RUNNER_TEMP/nb.jks" >> "$GITHUB_ENV"
          else
            echo "No NB_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
          fi

      - name: Unit tests and APK
        env:
          NB_KEYSTORE_PASSWORD: ${{ secrets.NB_KEYSTORE_PASSWORD }}
          NB_KEY_ALIAS: ${{ secrets.NB_KEY_ALIAS }}
          NB_KEY_PASSWORD: ${{ secrets.NB_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "notebooks-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: notebooks-apk
          path: notebooks-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" notebooks-*.apk --generate-notes
